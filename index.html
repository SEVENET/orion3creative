<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
  --bg:#020306;
  --cream:#F7F2EA;
  --muted:#B8C0D0;
  --dim:#747E93;
  --cyan:#8DF6F6;
  --blue:#438CFF;
  --gold:#E8C487;
  --green:#8FE2A0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#020306}
body{
  margin:0;background:#020306;color:var(--cream);
  font-family:Inter,system-ui,sans-serif;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 50% 10%,rgba(141,246,246,.14),transparent 32%),
    radial-gradient(circle at 84% 42%,rgba(232,196,135,.10),transparent 34%),
    radial-gradient(circle at 12% 78%,rgba(67,140,255,.12),transparent 38%),
    linear-gradient(180deg,rgba(2,3,6,.02),rgba(2,3,6,.88));
}
body::after{
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}
#three-canvas{
  position:fixed;inset:0;z-index:0;width:100vw;height:100vh;pointer-events:none;
  filter:saturate(1.16) contrast(1.08);
}
#root{position:relative;z-index:5}
.font-display{font-family:"Cormorant Garamond",serif}
.font-mono2{font-family:"JetBrains Mono",monospace}
.section{
  position:relative;min-height:115vh;display:grid;align-items:center;
  padding:130px 6vw 120px;overflow:hidden;perspective:1400px;
}
.section.short{min-height:102vh}
.first-title{min-height:100vh}
.bg-img{
  position:absolute;inset:-18vh -8vw;z-index:0;background-size:cover;background-position:center;
  transform:scale(1.12);filter:saturate(1.12) contrast(1.08);
}
.bg-img::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(2,3,6,.94),rgba(2,3,6,.65) 48%,rgba(2,3,6,.22)),
    radial-gradient(circle at 74% 46%,rgba(141,246,246,.18),transparent 27%),
    linear-gradient(180deg,rgba(2,3,6,.03),rgba(2,3,6,.92));
}
.bg-img.clean::after{
  background:
    radial-gradient(circle at 50% 44%,rgba(141,246,246,.20),transparent 22%),
    linear-gradient(180deg,rgba(2,3,6,.42),rgba(2,3,6,.88)),
    linear-gradient(90deg,rgba(2,3,6,.82),rgba(2,3,6,.40),rgba(2,3,6,.82));
}
.glass{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(6,8,13,.68);
  backdrop-filter:blur(16px);
  box-shadow:0 40px 140px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
}
.neon-edge{
  box-shadow:0 0 0 1px rgba(141,246,246,.22), 0 0 50px rgba(141,246,246,.08), inset 0 1px 0 rgba(255,255,255,.06);
}
.portal{
  position:relative;min-height:650px;border-radius:42px;overflow:hidden;
  transform-style:preserve-3d;transform:rotateY(-10deg) rotateX(4deg);
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.014));
  box-shadow:0 60px 170px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}
.portal::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(rgba(141,246,246,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(141,246,246,.06) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(circle at 50% 56%,black,transparent 72%);
}
.floor-ring{
  position:absolute;left:50%;top:61%;width:720px;height:720px;border:1px solid rgba(141,246,246,.26);
  border-radius:50%;transform:translate(-50%,-50%) rotateX(72deg) rotateZ(-18deg);
  box-shadow:0 0 90px rgba(141,246,246,.10);
}
.floor-ring::before,.floor-ring::after{
  content:"";position:absolute;inset:13%;border:1px solid rgba(232,196,135,.22);border-radius:50%;
}
.floor-ring::after{inset:31%;border-color:rgba(141,246,246,.22)}
.orb-ui{
  position:absolute;left:50%;top:48%;width:285px;height:285px;border-radius:50%;transform:translate(-50%,-50%);
  border:1px solid rgba(141,246,246,.35);
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.32),rgba(141,246,246,.14) 34%,rgba(67,140,255,.08) 58%,transparent 74%);
  box-shadow:0 0 105px rgba(141,246,246,.2), inset 0 0 58px rgba(141,246,246,.11);
}
.holo-object{
  position:absolute;width:118px;height:118px;border-radius:28px;
  background:linear-gradient(145deg,rgba(141,246,246,.18),rgba(255,255,255,.035));
  border:1px solid rgba(141,246,246,.32);
  box-shadow:0 34px 95px rgba(0,0,0,.42),0 0 48px rgba(141,246,246,.09);
  backdrop-filter:blur(10px);
}
.holo-object::after{
  content:attr(data-label);position:absolute;left:15px;bottom:13px;
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
}
.beam{
  position:absolute;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5;transform-origin:center;
}
.hotspot{
  position:absolute;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--cyan);background:rgba(141,246,246,.18);
  box-shadow:0 0 24px rgba(141,246,246,.52);
}
.hotspot::after{
  content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(141,246,246,.32);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.65);opacity:0}}
.card-img{height:150px;background-size:cover;background-position:center;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card-hover:hover .card-img{transform:scale(1.08)}
.mask-reveal{clip-path:inset(0 0 0 0)}
.progress{
  position:fixed;left:0;top:0;height:2px;width:0%;z-index:100;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--gold));
  box-shadow:0 0 18px rgba(141,246,246,.45);
}
.nav{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 5vw;background:linear-gradient(180deg,rgba(2,3,6,.9),rgba(2,3,6,0));
  backdrop-filter:blur(14px);
}
.dots{
  position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:75;
  display:flex;flex-direction:column;gap:14px;
}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:.35s}
.dots span.active{background:var(--cyan);box-shadow:0 0 18px var(--cyan);transform:scale(1.6)}
@media(max-width:900px){.dots,.nav .hide-mobile{display:none}.section{padding:110px 6vw}.portal{min-height:520px}}
</style>
</head>

<body>
<canvas id="three-canvas"></canvas>
<div class="progress" id="progress"></div>
<nav class="nav">
  <div class="font-display tracking-[.2em] text-xl">ORION<span class="italic text-[var(--cyan)]">3</span> CREATIVE</div>
  <div class="hide-mobile font-mono2 text-[10px] tracking-[.24em] uppercase text-[var(--muted)]">Immersive Real Estate · Staging · Spatial Commerce</div>
</nav>
<div class="dots" id="dots">
  <span class="active"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div id="root"></div>

          </div>

      </section>

      <section id="contact" className="section short text-center">
        <div className="bg-img clean parallax-bg" data-depth="-100" style={{backgroundImage:"url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2400&q=88')"}}></div>
        <div className="relative z-10 mx-auto max-w-5xl parallax-fore" data-depth="42">
          <div className="font-mono2 text-[11px] tracking-[.28em] uppercase text-[var(--cyan)] mb-5">Contact</div>
          <h2 className="font-display text-[clamp(54px,8vw,118px)] leading-[.92] tracking-[-.05em]">
            Let’s Build the Next<br/><em className="italic text-[var(--cyan)]">Immersive Experience</em>
          </h2>
          <p className="mt-7 mx-auto text-[var(--muted)] text-lg leading-relaxed max-w-2xl">
            A premium presentation layer for investors, partners and future clients.
          </p>
          <a href="mailto:rudasestn@gmail.com" className="inline-flex mt-11 items-center gap-4 rounded-full border border-[rgba(141,246,246,.45)] bg-black/60 px-7 py-4 font-mono2 text-[11px] tracking-[.22em] uppercase neon-edge hover:shadow-[0_0_45px_rgba(141,246,246,.18)] transition">
            Contact Orion <span className="w-12 h-px bg-[var(--cyan)]"></span>
          </a>
        </div>
      </section>
    </main>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
(function(){
  const progress=document.getElementById('progress');
  const dots=[...document.querySelectorAll('#dots span')];
  function update(){
    const h=document.documentElement;
    const p=h.scrollTop/(h.scrollHeight-h.clientHeight);
    progress.style.width=(p*100)+'%';
    const sections=[...document.querySelectorAll('section')];
    let idx=0;
    sections.forEach((s,i)=>{ if(s.getBoundingClientRect().top < innerHeight*.48) idx=i; });
    dots.forEach((d,i)=>d.classList.toggle('active',i===Math.min(idx,dots.length-1)));
  }
  addEventListener('scroll',update); setTimeout(update,500);

  gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray('[data-depth]').forEach(el=>{
    const speed=parseFloat(el.dataset.depth || 30);
    gsap.to(el,{
      y:speed,
      scale: el.classList.contains('parallax-bg') ? 1.04 : 1,
      rotateX: el.classList.contains('portal') ? 4 : 0,
      ease:'none',
      scrollTrigger:{trigger:el.closest('section'),start:'top bottom',end:'bottom top',scrub:true}
    });
  });
  gsap.utils.toArray('.glass,.rounded-\\[30px\\],.holo-object').forEach((el,i)=>{
    gsap.from(el,{opacity:0,y:80,z:-120,scale:.94,duration:1.1,ease:'power3.out',delay:(i%5)*.035,scrollTrigger:{trigger:el,start:'top 86%'}});
  });
  gsap.to('.floor-ring',{rotateZ:360,duration:44,repeat:-1,ease:'none'});
  gsap.to('.orb-ui',{scale:1.065,duration:3.2,repeat:-1,yoyo:true,ease:'sine.inOut'});
  gsap.to('.holo-object',{y:-22,rotateY:11,duration:2.7,repeat:-1,yoyo:true,ease:'sine.inOut',stagger:.22});
  gsap.to('.beam',{opacity:.82,duration:1.8,repeat:-1,yoyo:true,ease:'sine.inOut',stagger:.28});

  // Mouse parallax / magnetic depth
  let mx=0,my=0,smx=0,smy=0;
  addEventListener('mousemove',e=>{
    mx=(e.clientX/innerWidth-.5)*2;
    my=(e.clientY/innerHeight-.5)*2;
  });
  function mouseLoop(){
    smx+=(mx-smx)*.08; smy+=(my-smy)*.08;
    document.querySelectorAll('.portal').forEach(el=>{
      el.style.transform=`rotateY(${ -10 + smx*5 }deg) rotateX(${ 4 - smy*4 }deg) translate3d(${smx*10}px,${smy*8}px,0)`;
    });
    document.querySelectorAll('.glass').forEach(el=>{
      el.style.transform=`perspective(900px) rotateY(${smx*2.5}deg) rotateX(${-smy*2.5}deg)`;
    });
    requestAnimationFrame(mouseLoop);
  }
  mouseLoop();

  // Three.js ambient showroom
  const canvas=document.getElementById('three-canvas');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x020306,0);
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x020306,.007);
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
  camera.position.set(0,2.8,18);
  scene.add(new THREE.AmbientLight(0x243044,.9));
  const key=new THREE.DirectionalLight(0xffffff,1.2); key.position.set(8,12,10); scene.add(key);
  const cyan=new THREE.PointLight(0x8df6f6,2.2,42); cyan.position.set(-8,5,4); scene.add(cyan);
  const gold=new THREE.PointLight(0xe8c487,1.4,42); gold.position.set(8,4,-6); scene.add(gold);

  const group=new THREE.Group(); scene.add(group);
  const matGlass=new THREE.MeshPhysicalMaterial({color:0x8df6f6,roughness:.1,metalness:.15,transparent:true,opacity:.25,clearcoat:1,clearcoatRoughness:.08});
  const matGold=new THREE.MeshPhysicalMaterial({color:0xe8c487,roughness:.22,metalness:.75,clearcoat:.55,clearcoatRoughness:.18});
  const matDark=new THREE.MeshPhysicalMaterial({color:0x080b12,roughness:.38,metalness:.82,clearcoat:.5,clearcoatRoughness:.2});

  for(let i=0;i<22;i++){
    const geo=i%3===0?new THREE.BoxGeometry(1.2,1.2,1.2):i%3===1?new THREE.IcosahedronGeometry(.85,1):new THREE.CylinderGeometry(.55,.55,1.4,32);
    const mesh=new THREE.Mesh(geo,i%4===0?matGold:i%2===0?matGlass:matDark);
    mesh.position.set((Math.random()-.5)*28,(Math.random()-.5)*10,(Math.random()-.5)*30-8);
    mesh.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
    mesh.userData={rx:Math.random()*.01+.003,ry:Math.random()*.012+.004,phase:Math.random()*10};
    group.add(mesh);
  }
  const ringGeo=new THREE.TorusGeometry(5.2,.025,12,160);
  for(let i=0;i<6;i++){
    const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:i%2?0xe8c487:0x8df6f6,transparent:true,opacity:.16}));
    ring.rotation.x=Math.PI/2+i*.18;
    ring.position.z=-12-i*7;
    ring.userData={ring:true,speed:.003+i*.001};
    group.add(ring);
  }
  const clock=new THREE.Clock();
  function render(){
    const t=clock.getElapsedTime();
    camera.position.x=smx*1.7;
    camera.position.y=2.8-smy*.8;
    camera.lookAt(0,0,-8);
    group.children.forEach(o=>{
      o.rotation.x+=o.userData.rx||0;
      o.rotation.y+=o.userData.ry||0;
      if(o.userData.ring)o.rotation.z+=o.userData.speed;
      else o.position.y+=Math.sin(t*.8+o.userData.phase)*.0025;
    });
    renderer.render(scene,camera);
    requestAnimationFrame(render);
  }
  render();
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
